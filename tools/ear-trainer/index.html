<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<link rel="icon" href="../../images/logo-cyan.png" type="image/png">
<title>Entrenador de Oído Musical e Intervalos — Todologo</title>
<meta name="description" content="Reconoce 48 intervalos musicales, acordes mayores/menores/disminuidos, progresiones, escalas y lectura rápida en clave de Sol y Fa con WebAudio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0a0f14; --bg-lift: #121b23; --panel: rgba(13, 20, 27, 0.86);
  --line: #223140; --line-strong: #33475a; --fg: #e8edf0; --muted: #8d9ca9;
  --bone: #ecdec2; --scan: #6fd0e8; --ok: #5fd39a; --bad: #ff7a6b; --miss: #ff7a6b; --warn: #f0cf6a;
  --frame: #0c141b; --photo-bg: #0b131b;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --panel-w: 312px; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; height: 100dvh; margin: 0; }
body {
  color-scheme: dark;
  background: radial-gradient(120% 80% at 50% 45%, #121e28 0%, #0d151c 45%, var(--bg) 78%) fixed;
  color: var(--fg); font-family: var(--f-display); font-size: 14px; overflow: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { touch-action: manipulation; }
a { color: var(--scan); }
.ui.wide {
  position: fixed; inset: 0; height: 100dvh; box-sizing: border-box;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; display: grid;
  grid-template-columns: minmax(248px, 1fr) minmax(0, 740px) minmax(var(--panel-w), 1fr);
  grid-template-rows: auto minmax(0, 1fr); gap: 12px;
}
.ui.wide > * { pointer-events: auto; }
.brand { grid-column: 1; grid-row: 1; align-self: start; display: grid; gap: 5px; min-width: 0; text-shadow: 0 1px 10px rgba(5, 8, 11, 0.85); }
.lockup { display: flex; align-items: center; gap: 11px; min-width: 0; }
.home { display: inline-flex; align-items: center; gap: 5px; color: var(--bone); text-decoration: none; flex: none; border-radius: 7px; padding: 3px 7px 3px 6px; border: 1px solid var(--line-strong); background: rgba(13, 20, 27, 0.82); transition: border-color .15s, background .15s; }
.home::before { content: "\2190"; font-family: var(--f-mono); font-size: 13px; font-weight: 700; line-height: 1; color: var(--scan); }
.home:hover { border-color: var(--scan); background: rgba(19, 35, 44, 0.94); }
.home .logo-mark { height: 21px; width: 21px; object-fit: contain; display: block; flex: none; }
.brand .mark { font-weight: 800; font-stretch: 120%; letter-spacing: -0.01em; font-size: 18px; color: var(--bone); line-height: 1; white-space: nowrap; }
.brand .mark span { color: var(--scan); }
.brand .sub { color: var(--muted); font-size: 12.5px; font-stretch: 92%; }
body.clean .brand .sub { display: none; }

.centre { grid-column: 2; grid-row: 1 / 3; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.prompt { flex: none; width: 100%; box-sizing: border-box; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px 18px; display: grid; gap: 4px; text-align: center; position: relative; transition: border-color .15s; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--scan); }
.pname { font-weight: 750; font-stretch: 112%; font-size: clamp(20px, 2.4vw, 31px); line-height: 1.12; color: var(--bone); text-wrap: balance; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pmeta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 18px; }
.pbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.pbar i { display: block; height: 100%; width: 0%; background: var(--scan); transition: width .35s ease; }
.pbar.is-off { visibility: hidden; }
.prompt.is-ok { border-color: var(--ok); } .prompt.is-ok .eyebrow { color: var(--ok); }
.prompt.is-bad { border-color: var(--bad); } .prompt.is-bad .eyebrow { color: var(--bad); }
.prompt.is-warn { border-color: var(--warn); } .prompt.is-warn .eyebrow { color: var(--warn); }
.prompt.is-review { text-align: start; }
.prompt.is-review > :not(.eyebrow, .review, .pill) { display: none; }
.prompt.is-review > .eyebrow { padding-inline-end: 96px; min-height: 22px; align-content: center; }
.prompt > .pill { position: absolute; top: 10px; inset-inline-end: 18px; }
.pill { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: var(--ok); color: var(--bg); }
.review { display: grid; gap: 10px; margin-top: 4px; }
.res-main { display: flex; align-items: center; gap: 18px; }
.res-score { display: flex; align-items: baseline; gap: 8px; line-height: 0.9; flex: none; }
.res-score b { font-weight: 800; font-size: 62px; color: var(--bone); }
.res-score span { font-weight: 700; font-size: 24px; color: var(--muted); }
.res-tiles { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.res-tiles div { display: grid; gap: 3px; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(13, 20, 27, 0.55); }
.res-tiles b { font-family: var(--f-mono); font-size: 18px; font-weight: 600; color: var(--fg); }
.res-tiles span { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.res-actions .btn { flex: 1 1 0; padding: 11px 14px; font-size: 14px; font-weight: 700; border-radius: 9px; }
.res-actions .btn.primary { flex: 2 1 0; }
.res-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.res-foot .key { display: inline-flex; align-items: center; gap: 6px; }
.res-foot .key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.res-foot .key b { font-family: var(--f-mono); font-weight: 600; }
.res-foot .ok i { background: var(--ok); } .res-foot .ok b { color: var(--ok); }
.res-foot .bad i { background: var(--miss); } .res-foot .bad b { color: var(--miss); }
.res-foot .rhint { margin: 0; margin-inline-start: auto; }

.grid-bar { flex: none; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 6px 10px; }
.search-wrap { position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center; }
.search-wrap svg { position: absolute; left: 8px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search-input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13.5px; font-weight: 500; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 30px 7px 30px; outline: none; transition: border-color .15s; }
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--scan); }
.search-clear { position: absolute; right: 5px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font: 600 15px/1 system-ui, sans-serif; cursor: pointer; display: grid; place-items: center; }
.search-clear:hover { color: var(--fg); background: rgba(255, 255, 255, 0.08); }
.search-count { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; flex: none; }
.grid-empty { grid-column: 1 / -1; padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }

.stage { flex: 1 1 0; min-height: 0; display: flex; }
.view { flex: 1; min-height: 0; overflow: auto; box-sizing: border-box; position: relative; background: radial-gradient(90% 70% at 50% 0%, #13222c 0%, var(--frame) 70%); border: 1px solid var(--line-strong); border-radius: 18px; display: grid; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.stage.flash-ok .view { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.stage.flash-bad .view { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.note { color: var(--muted); font-size: 13.5px; line-height: 1.55; max-width: 56ch; text-align: center; margin: 0; }

/* Music & Ear Stage */
.show { display: grid; place-items: center; padding: clamp(10px, 2.5vw, 22px); min-height: 0; position: relative; }
.ear-plate {
  box-sizing: border-box; width: min(100%, 620px);
  background: linear-gradient(175deg, #131f2b 0%, #0a1118 100%);
  border: 1px solid var(--line-strong); border-radius: 16px;
  box-shadow: 0 20px 52px rgba(0, 0, 0, 0.52);
  padding: 14px 16px; display: grid; gap: 11px;
}
.ear-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.play-audio {
  font: inherit; font-weight: 700; font-size: 13px; color: #091016;
  background: var(--scan); border: 0; border-radius: 8px; padding: 7px 14px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  transition: transform .12s, filter .15s;
}
.play-audio:hover { filter: brightness(1.08); }
.play-audio.is-playing { background: var(--ok); transform: scale(0.98); }
.clef-badge { font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line-strong); background: rgba(10, 15, 20, 0.72); color: var(--bone); }
.staff-box { background: #070c11; border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; place-items: center; min-height: 120px; }
.staff-svg, .piano-svg { width: 100%; height: auto; display: block; }
.staff-svg { max-height: 132px; }
.piano-svg { max-height: 86px; }
.piano-key { cursor: pointer; transition: fill .12s; }
.piano-key:hover { filter: brightness(1.08); }
.blind-card { display: grid; gap: 6px; justify-items: center; padding: 14px 10px; text-align: center; }
.blind-card b { font-size: 15px; color: var(--bone); }
.blind-card small { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.show .credit-line { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 14px; }
.show .credit-line a { color: inherit; text-decoration: underline; text-decoration-color: rgba(141, 156, 169, 0.45); }

.grid { padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; align-content: start; }
.grid .pcard { font: inherit; color: var(--fg); text-align: start; cursor: pointer; padding: 0; overflow: hidden; background: var(--bg-lift); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-rows: auto 1fr; transition: border-color .15s, transform .15s; }
.grid .pcard:hover { border-color: var(--scan); transform: translateY(-1px); }
.thumb { aspect-ratio: 16 / 10; background: radial-gradient(120% 100% at 50% 15%, #162534 0%, #090f15 90%); display: grid; place-items: center; position: relative; overflow: hidden; padding: 8px; box-sizing: border-box; border-bottom: 1px solid var(--line); }
.thumb .code-hero { font-family: var(--f-mono); font-weight: 600; font-size: clamp(14px, 1.5vw, 19px); color: var(--bone); text-align: center; }
.thumb .clef-tag { position: absolute; left: 7px; top: 7px; font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; color: var(--scan); background: rgba(10, 15, 20, 0.85); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; }
.thumb .mode-tag { position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 5px; background: rgba(10, 15, 20, 0.85); border: 1px solid rgba(111, 208, 232, 0.3); font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; color: var(--ok); }
.grid .pcard .lbl { padding: 8px 9px; display: flex; align-items: center; min-width: 0; gap: 5px; }
.grid .pcard .lbl b { font-weight: 650; font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.grid .pcard.is-known .lbl b::after { content: " ✓"; color: var(--ok); }
.grid .head { grid-column: 1 / -1; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--scan); margin: 8px 2px 0; display: flex; align-items: center; justify-content: space-between; }

.detail { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 100%; }
.detail .show { padding-bottom: 24px; }
.spec-wrap { display: grid; gap: 8px; padding: 0 18px 16px; justify-items: center; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.facts span { font-family: var(--f-mono); font-size: 11px; color: var(--fg); background: rgba(10, 15, 20, 0.65); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; }
.facts span b { color: var(--scan); font-weight: 600; }
.fact-note { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); max-width: 62ch; text-align: center; text-wrap: pretty; }

.summary { padding: 18px; display: grid; gap: 14px; justify-items: center; align-content: start; }
.misses { width: 100%; max-width: 640px; display: grid; grid-template-columns: repeat(auto-fill, minmax(154px, 1fr)); gap: 8px; }
.misses button { font: inherit; cursor: pointer; padding: 0; overflow: hidden; display: grid; border-radius: 9px; background: var(--bg-lift); border: 1px solid var(--line); color: var(--fg); text-align: start; }
.misses button:hover { border-color: var(--scan); }
.misses .lbl { padding: 6px 9px 7px; display: grid; gap: 1px; }
.misses .lbl b { font-size: 12px; font-weight: 650; }
.misses .lbl small { font-size: 11px; color: var(--bad); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dock { flex: none; align-self: stretch; display: grid; gap: 8px; justify-items: center; justify-content: stretch; min-height: 46px; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: 100%; }
.actions:empty { display: none; }
.actions.row { display: flex; flex-wrap: wrap; justify-content: center; }
.act { font: inherit; font-weight: 700; font-size: 14.5px; color: var(--fg); cursor: pointer; text-align: start; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 9px; padding: 11px 14px; min-height: 46px; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
.act kbd { font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; flex: none; }
.act .txt { flex: 1; min-width: 0; }
.actions.row .act { justify-content: center; text-align: center; flex: 0 1 auto; min-width: 110px; }
.act:hover:not(:disabled) { border-color: var(--scan); }
.act:disabled { opacity: .32; cursor: default; }
.act.primary { background: var(--bone); color: #1b1610; border-color: var(--bone); }
.act.primary kbd { color: #5d5345; border-color: #a99c84; }
.act.is-right { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); opacity: 1; }
.act.is-wrong { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); opacity: 1; }
.typebox { width: 100%; display: flex; gap: 6px; }
.typebox input { flex: 1; min-width: 0; font: inherit; font-size: 16.5px; font-weight: 600; color: var(--fg); background: var(--bg-lift); border: 1px solid var(--line-strong); border-radius: 9px; padding: 11px 14px; outline: none; }
.typebox input:focus { border-color: var(--scan); }
.typebox .act { flex: none; }
.letters { font-size: 14px; letter-spacing: .06em; font-family: var(--f-mono); color: var(--scan); }
.navrow { display: flex; gap: 6px; justify-content: center; }
.navrow:not(:has(.btn:not([hidden]):not(#cleanExit))) { display: none; }
#settingsBtn, #cleanExit { display: none; }
body.clean #cleanExit { display: inline-block; opacity: .7; }

.leftcol { grid-column: 1; grid-row: 2; align-self: start; justify-self: start; width: 248px; max-height: 100%; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 10px; }
.rail { width: 100%; box-sizing: border-box; flex: 0 1 auto; min-height: 120px; max-height: 100%; overflow-y: auto; background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 8px; display: grid; gap: 3px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.rail-head { display: flex; align-items: center; gap: 7px; margin: 2px 6px 6px; }
.rail-title { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.rail button.rg { width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: start; cursor: pointer; padding: 7px 9px; font-size: 13px; font-weight: 650; }
.rail button.rg .r-txt { display: grid; gap: 1px; min-width: 0; }
.rail button.rg .r-era { font-family: var(--f-mono); font-size: 10px; font-weight: 500; color: var(--muted); }
.rail button em { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: none; }
.rail button em.done { color: var(--ok); }
.rail button em.done::after { content: " \2713"; }
.rail button.rg:hover { background: var(--bg-lift); }
.rail button[aria-pressed="true"] { border-color: var(--scan); background: rgba(111, 208, 232, 0.09); }
.rail button[aria-pressed="true"] em { color: var(--scan); }

.stats { grid-column: 3; grid-row: 1; justify-self: end; align-self: start; display: flex; gap: 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: grid; gap: 1px; min-width: 64px; }
.stat b { font-family: var(--f-mono); font-weight: 600; font-size: 16px; }
.stat small { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stats.is-off .stat { border-style: dashed; }
.stats.is-off .stat b, .stats.is-off .stat small { color: var(--line-strong); }

.panel { grid-column: 3; grid-row: 2; justify-self: end; align-self: start; width: var(--panel-w); box-sizing: border-box; max-height: 100%; overflow-y: auto; background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 14px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.panel h3 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.sec-h { display: flex; justify-content: flex-start; align-items: center; gap: 7px; margin-bottom: 7px; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; min-width: 0; }
.seg button { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit; font-weight: 600; font-size: 12.5px; color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 7px 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg-lift); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-strong); }
.seg button:hover { color: var(--fg); }
.panel section.is-off h3, .panel section.is-off .seg button { color: var(--line-strong); }
.panel section.is-off .seg button[aria-pressed="true"] { color: var(--muted); }
.panel section.is-off .seg { border-style: dashed; }
.panel section.is-off .seg button { cursor: default; background: none; box-shadow: none; }

.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--fg); background: var(--bg-lift); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 10px; cursor: pointer; }
.btn:hover { border-color: var(--scan); }
.btn[aria-pressed="true"] { border-color: var(--scan); color: var(--scan); }
.btn.primary { background: var(--bone); color: #1b1610; border-color: var(--bone); }
.btn:disabled { opacity: .45; cursor: default; }
.best { margin-top: 8px; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; color: var(--muted); }
.best b { color: var(--bone); font-weight: 600; }
.know { margin-top: 2px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.lang-pick { position: relative; display: block; }
.lang-pick svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--scan); pointer-events: none; }
.lang-pick::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
#langSel { width: 100%; appearance: none; -webkit-appearance: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 30px 8px 33px; cursor: pointer; }
#langSel option { background: var(--bg-lift); color: var(--fg); }

.panel-foot { display: flex; gap: 14px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.linkbtn { padding: 4px 0; font: 500 12px/1.2 var(--f-mono); color: var(--muted); background: none; border: 0; cursor: pointer; }
.linkbtn:hover { color: var(--scan); }
.credit { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 0; }
.help { position: relative; flex: none; width: 17px; height: 17px; padding: 0; font: 600 10.5px/1 var(--f-mono); color: var(--muted); background: transparent; border: 1px solid var(--line-strong); border-radius: 50%; cursor: pointer; display: inline-grid; place-items: center; }
.help:hover, .help[aria-expanded="true"] { color: var(--scan); border-color: var(--scan); }
.helpbox { position: fixed; z-index: 30; width: min(310px, calc(100vw - 24px)); box-sizing: border-box; display: grid; gap: 9px; padding: 12px 14px; background: var(--bg-lift); border: 1px solid var(--scan); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); font-size: 12.5px; line-height: 1.5; }
.helpbox b { display: block; font-weight: 650; font-size: 13px; color: var(--bone); }
.helpbox p { margin: 0; color: var(--muted); }
.overlay { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; z-index: 25; background: rgba(6, 10, 14, 0.65); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; }
.card { box-sizing: border-box; width: min(460px, 100%); max-height: 86dvh; overflow-y: auto; background: var(--bg-lift); border: 1px solid var(--line-strong); border-radius: 14px; padding: 20px; display: grid; gap: 13px; }
.card h2 { margin: 0; font-weight: 800; font-stretch: 118%; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--scan); }
.card p { margin: 0; color: var(--muted); line-height: 1.55; }
.card b { color: var(--fg); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-x { width: 28px; height: 28px; padding: 0; font: 400 20px/1 system-ui, sans-serif; color: var(--muted); background: none; border: 0; border-radius: 6px; cursor: pointer; }
.card-x:hover { color: var(--fg); background: rgba(255, 255, 255, 0.08); }
.keys-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; color: var(--fg); }
.keys-list kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; background: var(--bg); color: var(--fg); }
body.clean .panel, body.clean .leftcol, body.clean .actions, body.clean .grid-bar { display: none !important; }
body.clean .pname { font-size: clamp(26px, 3.8vw, 44px); }
.close-sheet { display: none; justify-self: end; }
:focus-visible { outline: 2px solid var(--scan); outline-offset: 2px; }

@media (min-width: 901px) and (max-width: 1180px) {
  .ui.wide { grid-template-columns: minmax(212px, 1fr) minmax(0, 620px) minmax(252px, 1fr); gap: 9px; }
  .leftcol { width: 212px; } .panel { width: 252px; padding: 11px; gap: 11px; } .brand .mark { font-size: 15.5px; }
}
@media (min-width: 901px) and (max-height: 780px) {
  .panel { gap: 10px; padding: 11px; } .show { padding: 10px 16px; } .act { min-height: 40px; padding: 8px 12px; font-size: 14px; }
}
@media (max-width: 900px) {
  .ui.wide { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr); gap: 8px; padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .brand { grid-column: 1; grid-row: 1; justify-self: center; } .home .logo-mark { height: 17px; width: 17px; } .brand .mark { font-size: 15px; } .brand .sub { display: none; }
  .stats { grid-column: 1; grid-row: 2; justify-self: center; } .stat { padding: 4px 9px; min-width: 56px; } .stat b { font-size: 14px; }
  .leftcol { display: flex; grid-column: 1; grid-row: 3; width: 100%; max-height: none; overflow: visible; }
  .rail { width: 100%; min-height: 0; max-height: none; overflow-x: auto; overflow-y: hidden; display: flex; flex-wrap: nowrap; align-items: center; gap: 5px; padding: 0; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; } .rail-head { display: none; }
  .rail button.rg { width: auto; flex: none; background: var(--panel); border-color: var(--line); white-space: nowrap; padding: 6px 10px; font-size: 12.5px; }
  .rail button.rg .r-era { display: none; }
  .centre { grid-column: 1; grid-row: 4; gap: 8px; } .prompt { padding: 9px 12px; } .pname { font-size: clamp(17px, 4.8vw, 23px); } .view { border-radius: 14px; } .ear-plate { border-radius: 14px; padding: 11px 12px; }
  .act { padding: 10px 11px; font-size: 13.5px; min-height: 44px; } .act kbd { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); padding: 10px; gap: 8px; }
  #settingsBtn { display: inline-block; } .wide-only { display: none !important; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 76dvh; overflow-y: auto; z-index: 20; border-radius: 16px 16px 0 0; border-bottom: 0; padding-block: 16px calc(env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transform: translateY(105%); transition: transform .25s ease; }
  body.sheet-open .panel { transform: none; } .panel .close-sheet { display: inline-block; } .res-score b { font-size: 48px; }
}
@media (max-width: 600px) { .show { padding: 8px; } .ear-plate { border-radius: 12px; gap: 8px; } .actions { gap: 5px; } .typebox input { font-size: 15px; padding: 9px 11px; } .spec-wrap { padding: 0 12px 12px; } .grid-bar { padding: 5px 8px; } }
@media (max-width: 900px) and (max-height: 520px) { .brand, .stats { display: none; } .ui.wide { grid-template-rows: auto minmax(0, 1fr); } .leftcol { grid-row: 1; } .centre { grid-row: 2; gap: 6px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div class="ui wide">
  <div class="brand">
    <div class="lockup">
      <a class="home" id="homeLink" href="../../Todologo.html" aria-label="Volver al menú de Todologo" title="← Volver al menú de Todologo">
        <img class="logo-mark" src="../../images/logo-cyan.png" alt="Todologo">
      </a>
      <div class="mark" id="toolMark">OÍDO <span>MUSICAL</span></div>
    </div>
    <div class="sub" id="brandSub">Intervalos, acordes, progresiones y lectura en clave de Sol y Fa</div>
  </div>

  <div class="leftcol">
    <nav class="rail" id="rail" aria-label="Categorías musicales">
      <div class="rail-head">
        <h3 class="rail-title" id="railTitle">Categorías</h3>
        <button class="help" type="button" data-help="rail" aria-label="Qué hace esto">i</button>
      </div>
      <div id="railList" style="display:contents"></div>
    </nav>
  </div>

  <main class="centre">
    <div class="prompt" id="prompt" aria-live="polite">
      <div class="eyebrow" id="pEyebrow">Cargando</div>
      <div class="pname" id="pName">Oído Musical</div>
      <div class="pmeta" id="pMeta">&nbsp;</div>
      <div class="pbar is-off" id="pBarWrap"><i id="pBar"></i></div>
      <div class="review" id="reviewPanel" hidden></div>
    </div>

    <div class="grid-bar" id="gridBar" hidden>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search-input" id="exploreSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar intervalo, acorde, canción guía o nota (Sol4, Do4)…" aria-label="Buscar ejercicio">
        <button class="search-clear" id="exploreClear" type="button" aria-label="Limpiar búsqueda" hidden>×</button>
      </div>
      <span class="search-count" id="exploreCount"></span>
    </div>

    <div class="stage" id="stageBox"><div class="view" id="view"></div></div>

    <div class="dock">
      <div class="actions" id="actions"></div>
      <div class="navrow">
        <button class="btn" id="settingsBtn" type="button">Ajustes</button>
        <button class="btn" id="cleanExit" type="button">Salir de vista limpia</button>
      </div>
    </div>
  </main>

  <div class="stats" id="stats">
    <div class="stat"><small id="lblAcc">Acierto</small><b id="sAcc">–</b></div>
    <div class="stat"><small id="lblTime">Tiempo</small><b id="sTime">0:00</b></div>
    <div class="stat"><small id="lblStreak">Racha</small><b id="sStreak">0</b></div>
  </div>

  <aside class="panel" id="panel" aria-label="Ajustes">
    <button class="btn close-sheet" id="closeSheet" type="button">Listo</button>
    <section id="langBox">
      <div class="sec-h"><h3 id="lblLang"><label for="langSel">Idioma</label></h3></div>
      <span class="lang-pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>
        <select id="langSel"><option value="es">Español</option><option value="en">English</option></select>
      </span>
    </section>
    <section>
      <div class="sec-h"><h3 id="lblMode">Modo</h3><button class="help" type="button" data-help="mode" aria-label="Qué hace esto">i</button></div>
      <div class="seg" id="modeSeg"><button type="button" data-v="study">Explorar</button><button type="button" data-v="practice">Aprender</button><button type="button" data-v="test">Examen</button></div>
    </section>
    <section>
      <div class="sec-h"><h3 id="lblSet">Conjunto</h3></div>
      <div class="seg" id="setSeg"><button type="button" data-v="popular">Esenciales</button><button type="button" data-v="all">Todos</button></div>
    </section>
    <section id="cueBox">
      <div class="sec-h"><h3 id="lblCue">Guía visual</h3><button class="help" type="button" data-help="cue" aria-label="Qué hace esto">i</button></div>
      <div class="seg" id="cueSeg"><button type="button" data-v="visual">Con pentagrama</button><button type="button" data-v="blind">Solo oído</button></div>
    </section>
    <section id="answerBox">
      <div class="sec-h"><h3 id="lblAnswer">Responder</h3></div>
      <div class="seg" id="answerSeg"><button type="button" data-v="choose">Eligiendo</button><button type="button" data-v="type">Escribiendo</button></div>
    </section>
    <section>
      <div class="row">
        <button class="btn primary" id="restartBtn" type="button">Reiniciar</button>
        <button class="btn" id="cleanBtn" type="button">Vista limpia</button>
        <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sonido: Sí</button>
      </div>
      <div class="best" id="best"></div>
      <div class="know" id="know"></div>
    </section>
    <div class="panel-foot"><button class="linkbtn wide-only" id="keysBtn" type="button">Teclas</button><button class="linkbtn" id="howBtn" type="button">Cómo funciona</button></div>
    <p class="credit" id="creditLine"></p>
  </aside>
</div>

<div class="overlay" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="card how"><div class="dlg-head"><h2 id="introTitle">Entrena oído y lectura</h2><button class="card-x" id="introClose" type="button" aria-label="Cerrar">×</button></div><p id="intro1"></p><p id="intro2"></p><p id="intro3"></p></div>
</div>
<div class="overlay" id="keysModal" hidden role="dialog" aria-modal="true" aria-labelledby="keysTitle">
  <div class="card"><div class="dlg-head"><h2 id="keysTitle">Teclas</h2><button class="card-x" id="keysClose" type="button" aria-label="Cerrar">×</button></div><ul class="keys-list" id="keysList"></ul></div>
</div>

<script src="../../js/progress.js"></script>
<script src="ear-data.js"></script>
<script src="app.js"></script>
</body>
</html>
