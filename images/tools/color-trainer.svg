<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glowC" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe09e"/>
      <stop offset="50%" stop-color="#ff9b26"/>
      <stop offset="100%" stop-color="#b85108"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Holographic base -->
  <ellipse cx="110" cy="155" rx="68" ry="11" fill="url(#glowC)"/>
  <ellipse cx="110" cy="155" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="155" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- Ambient glow -->
  <circle cx="110" cy="82" r="64" fill="url(#glowC)"/>

  <!-- Chromatic Wheel + Triadic Harmony Geometry -->
  <g transform="translate(110, 82)">
    <!-- Outer segmented ring -->
    <circle r="54" fill="url(#amberGlass)" stroke="url(#amberEdge)" stroke-width="2.2"/>
    <circle r="36" fill="#0e0d0b" fill-opacity="0.55" stroke="#ffd384" stroke-opacity="0.65" stroke-width="1.4"/>

    <!-- 12 Hue sector spokes -->
    <g stroke="#ff9b26" stroke-opacity="0.5" stroke-width="1.1">
      <line x1="0" y1="-54" x2="0" y2="-36"/>
      <line x1="27" y1="-46.7" x2="18" y2="-31.1"/>
      <line x1="46.7" y1="-27" x2="31.1" y2="-18"/>
      <line x1="54" y1="0" x2="36" y2="0"/>
      <line x1="46.7" y1="27" x2="31.1" y2="18"/>
      <line x1="27" y1="46.7" x2="18" y2="31.1"/>
      <line x1="0" y1="54" x2="0" y2="36"/>
      <line x1="-27" y1="46.7" x2="-18" y2="31.1"/>
      <line x1="-46.7" y1="27" x2="-31.1" y2="18"/>
      <line x1="-54" y1="0" x2="-36" y2="0"/>
      <line x1="-46.7" y1="-27" x2="-31.1" y2="-18"/>
      <line x1="-27" y1="-46.7" x2="-18" y2="-31.1"/>
    </g>

    <!-- Highlighted hue wedges -->
    <path d="M 0,-54 A 54,54 0 0,1 27,-46.7 L 18,-31.1 A 36,36 0 0,0 0,-36 Z" fill="#ffd384" fill-opacity="0.75"/>
    <path d="M 46.7,27 A 54,54 0 0,1 27,46.7 L 18,31.1 A 36,36 0 0,0 31.1,18 Z" fill="#ff9b26" fill-opacity="0.65"/>
    <path d="M -27,46.7 A 54,54 0 0,1 -46.7,27 L -31.1,18 A 36,36 0 0,0 -18,31.1 Z" fill="#ff9b26" fill-opacity="0.55"/>

    <!-- Inner Triadic Harmony Triangle -->
    <polygon points="0,-34 29.4,17 -29.4,17" fill="#ff9b26" fill-opacity="0.18" stroke="#ffe09e" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="0" cy="-34" r="4.2" fill="#fff0c2" stroke="#ff9b26" stroke-width="1.5"/>
    <circle cx="29.4" cy="17" r="4.2" fill="#ffd384" stroke="#ff9b26" stroke-width="1.5"/>
    <circle cx="-29.4" cy="17" r="4.2" fill="#ffd384" stroke="#ff9b26" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#ffd384"/>
  </g>
</svg>
