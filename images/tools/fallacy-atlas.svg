<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glowF" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe09e"/>
      <stop offset="50%" stop-color="#ff9b26"/>
      <stop offset="100%" stop-color="#b85108"/>
    </linearGradient>
    <linearGradient id="amberSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Holographic base -->
  <ellipse cx="110" cy="155" rx="68" ry="11" fill="url(#glowF)"/>
  <ellipse cx="110" cy="155" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="155" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>

  <circle cx="110" cy="82" r="64" fill="url(#glowF)"/>

  <!-- Scales of Logic / Syllogism Prism -->
  <g transform="translate(110, 82)">
    <!-- Central pillar -->
    <line x1="0" y1="-50" x2="0" y2="56" stroke="url(#amberLine)" stroke-width="2.6"/>
    <polygon points="-24,56 24,56 16,47 -16,47" fill="url(#amberSoft)" stroke="#ffd384" stroke-width="1.5"/>
    <circle cx="0" cy="-42" r="6.5" fill="#0e0d0b" stroke="#ffe09e" stroke-width="2"/>

    <!-- Tilted balance beam (representing a cognitive bias / logical tilt) -->
    <line x1="-58" y1="-30" x2="58" y2="-48" stroke="#ffe09e" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Left pan (heavy / illusion) -->
    <line x1="-54" y1="-30" x2="-68" y2="6" stroke="#ff9b26" stroke-width="1.3" stroke-opacity="0.8"/>
    <line x1="-54" y1="-30" x2="-40" y2="6" stroke="#ff9b26" stroke-width="1.3" stroke-opacity="0.8"/>
    <path d="M -72,6 Q -54,20 -36,6 Z" fill="url(#amberSoft)" stroke="#ffd384" stroke-width="1.7"/>
    <!-- Syllogism symbol on left pan -->
    <text x="-61" y="-1" fill="#ffe09e" font-family="monospace" font-weight="700" font-size="13">P⇒Q</text>

    <!-- Right pan (higher) -->
    <line x1="54" y1="-48" x2="40" y2="-12" stroke="#ff9b26" stroke-width="1.3" stroke-opacity="0.8"/>
    <line x1="54" y1="-48" x2="68" y2="-12" stroke="#ff9b26" stroke-width="1.3" stroke-opacity="0.8"/>
    <path d="M 36,-12 Q 54,2 72,-12 Z" fill="url(#amberSoft)" stroke="#ffd384" stroke-width="1.7"/>
    <text x="45" y="-19" fill="#ff9b26" font-family="monospace" font-weight="700" font-size="13">¬P</text>
  </g>
</svg>
