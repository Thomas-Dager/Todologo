<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glowT" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b85108"/>
      <stop offset="50%" stop-color="#ff9b26"/>
      <stop offset="100%" stop-color="#ffe09e"/>
    </linearGradient>
    <linearGradient id="amberGlassT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <ellipse cx="110" cy="155" rx="68" ry="11" fill="url(#glowT)"/>
  <ellipse cx="110" cy="155" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="155" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>
  <circle cx="110" cy="82" r="64" fill="url(#glowT)"/>

  <!-- Hourglass behind the timeline -->
  <g transform="translate(110, 70)">
    <path d="M -26,-44 L 26,-44 L 4,-2 L 26,40 L -26,40 L -4,-2 Z" fill="url(#amberGlassT)" stroke="#ffd384" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="-32" y1="-46" x2="32" y2="-46" stroke="#ffe09e" stroke-width="3" stroke-linecap="round"/>
    <line x1="-32" y1="42" x2="32" y2="42" stroke="#ffe09e" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14,-30 L 14,-30 L 2,-6 L -2,-6 Z" fill="#ff9b26" fill-opacity="0.75"/>
    <path d="M -18,38 Q 0,22 18,38 Z" fill="#ffb84d" fill-opacity="0.85"/>
    <line x1="0" y1="-4" x2="0" y2="26" stroke="#fff0c2" stroke-width="1.2" stroke-dasharray="2 2"/>
  </g>

  <!-- Horizontal timeline with era nodes -->
  <line x1="28" y1="128" x2="192" y2="128" stroke="url(#amberT)" stroke-width="2.6" stroke-linecap="round"/>
  <g stroke="#ff9b26" stroke-width="1.6">
    <circle cx="40" cy="128" r="5" fill="#0e0d0b"/>
    <circle cx="76" cy="128" r="5" fill="#0e0d0b"/>
    <circle cx="112" cy="128" r="6.5" fill="#ffb84d"/>
    <circle cx="148" cy="128" r="5" fill="#0e0d0b"/>
    <circle cx="184" cy="128" r="5" fill="#fff0c2"/>
  </g>
  <g font-family="monospace" font-weight="700" font-size="8.5" fill="#ffd384" text-anchor="middle">
    <text x="40" y="117">-3000</text>
    <text x="76" y="117">0</text>
    <text x="112" y="117">1492</text>
    <text x="148" y="117">1789</text>
    <text x="184" y="117">1969</text>
  </g>
</svg>
