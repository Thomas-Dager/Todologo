<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glowP" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberStrokeP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe09e"/>
      <stop offset="50%" stop-color="#ff9b26"/>
      <stop offset="100%" stop-color="#b85108"/>
    </linearGradient>
    <linearGradient id="amberFillP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <ellipse cx="110" cy="155" rx="68" ry="11" fill="url(#glowP)"/>
  <ellipse cx="110" cy="155" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="155" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>
  <circle cx="110" cy="82" r="64" fill="url(#glowP)"/>

  <!-- Mini Periodic Table Silhouette + Orbital Atom -->
  <g transform="translate(110, 82)">
    <!-- Table backdrop grid -->
    <g stroke="#ff9b26" stroke-opacity="0.45" stroke-width="1" fill="url(#amberFillP)">
      <rect x="-58" y="-42" width="12" height="12" rx="1.5"/>
      <rect x="46" y="-42" width="12" height="12" rx="1.5"/>
      <rect x="-58" y="-28" width="12" height="12" rx="1.5"/>
      <rect x="-44" y="-28" width="12" height="12" rx="1.5"/>
      <rect x="18" y="-28" width="12" height="12" rx="1.5"/>
      <rect x="32" y="-28" width="12" height="12" rx="1.5"/>
      <rect x="46" y="-28" width="12" height="12" rx="1.5"/>
      <rect x="-58" y="-14" width="12" height="12" rx="1.5"/>
      <rect x="-44" y="-14" width="12" height="12" rx="1.5"/>
      <rect x="-30" y="-14" width="12" height="12" rx="1.5"/>
      <rect x="18" y="-14" width="12" height="12" rx="1.5"/>
      <rect x="32" y="-14" width="12" height="12" rx="1.5"/>
      <rect x="46" y="-14" width="12" height="12" rx="1.5"/>
    </g>

    <!-- Highlighted central Element Tile (79 Au / 6 C) -->
    <rect x="-24" y="-24" width="48" height="52" rx="6" fill="#18120c" fill-opacity="0.88" stroke="url(#amberStrokeP)" stroke-width="2.2"/>
    <text x="-17" y="-10" fill="#ffd384" font-family="monospace" font-weight="700" font-size="10">79</text>
    <text x="0" y="10" text-anchor="middle" fill="#fff0c2" font-family="sans-serif" font-weight="800" font-size="22">Au</text>
    <text x="0" y="22" text-anchor="middle" fill="#ff9b26" font-family="monospace" font-size="8">196.97</text>

    <!-- Atom electron rings orbiting -->
    <ellipse cx="0" cy="4" rx="60" ry="20" transform="rotate(-24 0 4)" stroke="#ffe09e" stroke-opacity="0.7" stroke-width="1.3"/>
    <ellipse cx="0" cy="4" rx="60" ry="20" transform="rotate(24 0 4)" stroke="#ff9b26" stroke-opacity="0.7" stroke-width="1.3"/>
    <circle cx="-48" cy="-16" r="3.4" fill="#fff0c2"/>
    <circle cx="48" cy="24" r="3.4" fill="#ffd384"/>
  </g>
</svg>
