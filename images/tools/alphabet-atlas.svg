<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberEdgeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe09e"/>
      <stop offset="50%" stop-color="#ff9b26"/>
      <stop offset="100%" stop-color="#b85108"/>
    </linearGradient>
    <linearGradient id="amberGlassA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Holographic base -->
  <ellipse cx="110" cy="155" rx="68" ry="11" fill="url(#glowA)"/>
  <ellipse cx="110" cy="155" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="155" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>

  <circle cx="110" cy="82" r="64" fill="url(#glowA)"/>

  <!-- Rosetta Stone / Multi-Script Tablet Grid -->
  <g transform="translate(110, 82)">
    <!-- Outer arched stele (Rosetta tablet) -->
    <path d="M -52,-32 A 52,26 0 0,1 52,-32 L 52,48 Q 52,54 46,54 L -46,54 Q -52,54 -52,48 Z" fill="url(#amberGlassA)" stroke="url(#amberEdgeA)" stroke-width="2.2"/>

    <!-- Grid dividers -->
    <line x1="-52" y1="-4" x2="52" y2="-4" stroke="#ff9b26" stroke-width="1.2" stroke-opacity="0.65"/>
    <line x1="-52" y1="24" x2="52" y2="24" stroke="#ff9b26" stroke-width="1.2" stroke-opacity="0.65"/>
    <line x1="0" y1="-36" x2="0" y2="54" stroke="#ff9b26" stroke-width="1.2" stroke-opacity="0.65"/>

    <!-- 6 World Scripts Glyphs -->
    <text x="-26" y="-13" text-anchor="middle" fill="#fff0c2" font-family="serif" font-weight="700" font-size="20">Ω</text>
    <text x="26" y="-13" text-anchor="middle" fill="#ffd384" font-family="sans-serif" font-weight="700" font-size="19">Ж</text>
    <text x="-26" y="16" text-anchor="middle" fill="#ffd384" font-family="sans-serif" font-weight="700" font-size="18">한</text>
    <text x="26" y="16" text-anchor="middle" fill="#fff0c2" font-family="sans-serif" font-weight="700" font-size="18">あ</text>
    <text x="-26" y="44" text-anchor="middle" fill="#ff9b26" font-family="serif" font-weight="700" font-size="19">א</text>
    <text x="26" y="44" text-anchor="middle" fill="#ff9b26" font-family="serif" font-weight="700" font-size="19">ع</text>
  </g>
</svg>
