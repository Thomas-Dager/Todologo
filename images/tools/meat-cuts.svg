<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glowM" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberStrokeM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe09e"/>
      <stop offset="50%" stop-color="#ff9b26"/>
      <stop offset="100%" stop-color="#b85108"/>
    </linearGradient>
    <linearGradient id="amberFillM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Holographic base rings -->
  <ellipse cx="110" cy="155" rx="68" ry="11" fill="url(#glowM)"/>
  <ellipse cx="110" cy="155" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="155" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>
  <circle cx="110" cy="84" r="64" fill="url(#glowM)"/>

  <!-- Steer / Beef Primal Cuts Hologram -->
  <g transform="translate(8, 8)">
    <!-- Steer silhouette facing left -->
    <path d="M52 54 C42 48, 32 45, 25 46 C22 40, 26 34, 32 33 C28 38, 30 43, 36 44
             C48 45, 58 46, 68 42 C86 38, 126 37, 160 40 C172 42, 180 49, 180 62
             L176 92 L180 124 L170 126 L165 96 L154 96 L149 124 L140 124 L144 92
             C122 93, 96 93, 76 90 L72 124 L62 124 L64 94 L54 95 L48 122 L39 122
             L45 86 C38 80, 34 72, 34 65 L22 68 L20 60 L35 55 Z"
          fill="url(#amberFillM)" stroke="url(#amberStrokeM)" stroke-width="2" stroke-linejoin="round"/>

    <!-- Dashed primal cut grid divisions -->
    <g stroke="#ffe09e" stroke-opacity="0.72" stroke-width="1.1" stroke-dasharray="3 2.5">
      <line x1="74" y1="41" x2="72" y2="90"/>
      <line x1="102" y1="39" x2="100" y2="92"/>
      <line x1="130" y1="39" x2="128" y2="92"/>
      <line x1="152" y1="40" x2="148" y2="92"/>
      <line x1="73" y1="68" x2="150" y2="69"/>
      <line x1="46" y1="68" x2="72" y2="72"/>
    </g>

    <!-- Highlighted Loin / Rib region -->
    <path d="M102 39 L130 39 L129 68 L101 68 Z" fill="#ff9b26" fill-opacity="0.28" stroke="#ffe09e" stroke-width="1.2"/>

    <!-- Minimal region markers -->
    <text x="87" y="57" text-anchor="middle" fill="#ffd384" font-family="monospace" font-size="8.5" font-weight="700">01</text>
    <text x="115" y="57" text-anchor="middle" fill="#fff0c2" font-family="monospace" font-size="8.5" font-weight="700">02</text>
    <text x="140" y="57" text-anchor="middle" fill="#ffd384" font-family="monospace" font-size="8.5" font-weight="700">03</text>
  </g>
</svg>
