<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="philBg" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#193344"/>
      <stop offset="100%" stop-color="#0b131a"/>
    </radialGradient>
    <linearGradient id="philGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7df97"/>
      <stop offset="55%" stop-color="#e5b85c"/>
      <stop offset="100%" stop-color="#a87928"/>
    </linearGradient>
    <linearGradient id="philCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ee8fa"/>
      <stop offset="100%" stop-color="#4ab5d4"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#philBg)" stroke="#294456" stroke-width="1.5"/>

  <!-- Classical Temple Pediment (Antiquity) -->
  <polygon points="14,23 32,12 50,23" fill="#172b3a" stroke="url(#philGold)" stroke-width="1.7" stroke-linejoin="round"/>
  <line x1="13" y1="26" x2="51" y2="26" stroke="url(#philGold)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Three Columns -->
  <g stroke="url(#philGold)" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <line x1="19" y1="29" x2="19" y2="48"/>
    <line x1="32" y1="29" x2="32" y2="48"/>
    <line x1="45" y1="29" x2="45" y2="48"/>
  </g>
  <line x1="13" y1="51" x2="51" y2="51" stroke="url(#philGold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Owl of Minerva / Dialectical Concept Network Overlay -->
  <g stroke="url(#philCyan)" stroke-width="1.3" opacity="0.9">
    <line x1="21" y1="36" x2="32" y2="32"/>
    <line x1="32" y1="32" x2="43" y2="39"/>
    <line x1="21" y1="36" x2="32" y2="43"/>
    <line x1="32" y1="43" x2="43" y2="39"/>
  </g>
  <circle cx="32" cy="32" r="2.6" fill="#0b131a" stroke="#6fd0e8" stroke-width="1.5"/>
  <circle cx="21" cy="36" r="2.3" fill="#0b131a" stroke="#f0cf6a" stroke-width="1.4"/>
  <circle cx="43" cy="39" r="2.3" fill="#0b131a" stroke="#5fd39a" stroke-width="1.4"/>
  <circle cx="32" cy="43" r="2.3" fill="#0b131a" stroke="#d2a8ff" stroke-width="1.4"/>
</svg>
