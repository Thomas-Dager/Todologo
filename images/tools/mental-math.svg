<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff9b26" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#d8680e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd384"/>
      <stop offset="50%" stop-color="#ff9624"/>
      <stop offset="100%" stop-color="#b85108"/>
    </linearGradient>
    <linearGradient id="amberFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9e4204" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- Holographic base ellipse -->
  <ellipse cx="110" cy="154" rx="68" ry="11" fill="url(#glow)"/>
  <ellipse cx="110" cy="154" rx="64" ry="9.5" stroke="#ff9b26" stroke-opacity="0.55" stroke-width="1.2"/>
  <ellipse cx="110" cy="154" rx="44" ry="5.5" stroke="#ffd384" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- Ambient glow behind soroban / math frame -->
  <circle cx="110" cy="82" r="64" fill="url(#glow)"/>

  <!-- 3D Perspective Soroban / Abacus Frame -->
  <g transform="translate(0, -2)">
    <!-- Outer frame back shadow -->
    <polygon points="48,34 176,26 170,132 42,140" fill="url(#amberFill)" stroke="#b85108" stroke-width="1.2" stroke-opacity="0.55"/>
    <!-- Outer frame front -->
    <polygon points="44,30 172,22 166,128 38,136" fill="url(#amberFill)" stroke="url(#amberFrame)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Reckoning bar (horizontal divider between Heaven and Earth beads) -->
    <line x1="42" y1="60" x2="170" y2="52" stroke="#ffd384" stroke-width="2.4"/>

    <!-- 4 Vertical rods -->
    <line x1="69" y1="29" x2="63" y2="134" stroke="#ff9b26" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="97" y1="27" x2="91" y2="132" stroke="#ff9b26" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="125" y1="25" x2="119" y2="130" stroke="#ff9b26" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="153" y1="23" x2="147" y2="128" stroke="#ff9b26" stroke-width="1.5" stroke-opacity="0.75"/>

    <!-- Heaven Beads (top row, 5-value) -->
    <polygon points="68,36 79,43 68,50 57,43" fill="#ff9b26" fill-opacity="0.65" stroke="#ffd384" stroke-width="1.3"/>
    <polygon points="96,41 107,48 96,55 85,48" fill="#ffb84d" fill-opacity="0.88" stroke="#fff0c2" stroke-width="1.5"/>
    <polygon points="124,33 135,40 124,47 113,40" fill="#ff9b26" fill-opacity="0.65" stroke="#ffd384" stroke-width="1.3"/>
    <polygon points="152,38 163,45 152,52 141,45" fill="#ffb84d" fill-opacity="0.88" stroke="#fff0c2" stroke-width="1.5"/>

    <!-- Earth Beads Rod 1 -->
    <polygon points="66,64 77,71 66,78 55,71" fill="#ffb84d" fill-opacity="0.85" stroke="#fff0c2" stroke-width="1.4"/>
    <polygon points="65,79 76,86 65,93 54,86" fill="#ffb84d" fill-opacity="0.85" stroke="#fff0c2" stroke-width="1.4"/>
    <polygon points="64,104 75,111 64,118 53,111" fill="#ff9b26" fill-opacity="0.45" stroke="#ff9b26" stroke-width="1.2"/>

    <!-- Earth Beads Rod 2 -->
    <polygon points="94,63 105,70 94,77 83,70" fill="#ffb84d" fill-opacity="0.85" stroke="#fff0c2" stroke-width="1.4"/>
    <polygon points="93,88 104,95 93,102 82,95" fill="#ff9b26" fill-opacity="0.45" stroke="#ff9b26" stroke-width="1.2"/>
    <polygon points="92,103 103,110 92,117 81,110" fill="#ff9b26" fill-opacity="0.45" stroke="#ff9b26" stroke-width="1.2"/>

    <!-- Earth Beads Rod 3 -->
    <polygon points="122,61 133,68 122,75 111,68" fill="#ffb84d" fill-opacity="0.85" stroke="#fff0c2" stroke-width="1.4"/>
    <polygon points="121,76 132,83 121,90 110,83" fill="#ffb84d" fill-opacity="0.85" stroke="#fff0c2" stroke-width="1.4"/>
    <polygon points="120,91 131,98 120,105 109,98" fill="#ffb84d" fill-opacity="0.85" stroke="#fff0c2" stroke-width="1.4"/>

    <!-- Earth Beads Rod 4 -->
    <polygon points="150,70 161,77 150,84 139,77" fill="#ff9b26" fill-opacity="0.45" stroke="#ff9b26" stroke-width="1.2"/>
    <polygon points="149,85 160,92 149,99 138,92" fill="#ff9b26" fill-opacity="0.45" stroke="#ff9b26" stroke-width="1.2"/>
    <polygon points="148,100 159,107 148,114 137,107" fill="#ff9b26" fill-opacity="0.45" stroke="#ff9b26" stroke-width="1.2"/>

    <!-- Floating math symbols hologram -->
    <text x="24" y="54" fill="#ffd384" fill-opacity="0.75" font-family="monospace" font-weight="700" font-size="15">∑</text>
    <text x="182" y="48" fill="#ffd384" fill-opacity="0.8" font-family="monospace" font-weight="700" font-size="15">x²</text>
    <text x="180" y="106" fill="#ff9b26" fill-opacity="0.75" font-family="monospace" font-weight="700" font-size="14">√n</text>
  </g>
</svg>
